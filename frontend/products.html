<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products · Inventory</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="brand__logo">IM</div>
      <div class="brand__text">
        <span class="brand__title">Inventory</span>
        <span class="brand__subtitle">Management</span>
      </div>
    </div>
    <nav class="sidebar__nav">
      <a class="nav-item" href="index.html"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
      <a class="nav-item nav-item--active" href="products.html"><i class="fa-solid fa-boxes-stacked"></i><span>Products</span></a>
      <a class="nav-item" href="categories.html"><i class="fa-solid fa-layer-group"></i><span>Categories</span></a>
      <a class="nav-item" href="stock.html"><i class="fa-solid fa-right-left"></i><span>Stock</span></a>
      <a class="nav-item" href="sales.html"><i class="fa-solid fa-receipt"></i><span>Sales</span></a>
      <a class="nav-item" href="reports.html"><i class="fa-solid fa-chart-line"></i><span>Reports</span></a>
    </nav>
    <div class="sidebar__footer">Products</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__left">
        <h1 class="page-title">Products</h1>
        <p class="page-subtitle">Browse, filter, and add inventory items.</p>
      </div>
      <div class="topbar__right">
        <div class="user-card">
          <div class="user-card__info">
            <span class="user-card__name" id="current-user-name">—</span>
            <span class="user-card__role" id="current-user-email">—</span>
          </div>
          <div class="user-card__avatar" id="current-user-avatar">?</div>
        </div>
        <button type="button" class="btn btn--ghost btn--sm" id="logout-btn" title="Log out"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <input class="toolbar__search" type="search" id="product-search" placeholder="Search products…" />
        <select class="select" id="product-status-filter">
          <option value="ALL">All statuses</option>
          <option value="IN_STOCK">In stock</option>
          <option value="LOW_STOCK">Low stock</option>
          <option value="OUT_OF_STOCK">Out of stock</option>
        </select>
        <button type="button" class="btn" id="btn-new-product"><i class="fa-solid fa-plus"></i> New product</button>
      </div>

      <div class="card">
        <div class="card__body" style="padding:0">
          <div class="table-wrapper">
            <table class="table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Supplier</th>
                  <th class="text-right">Price</th>
                  <th class="text-right">Qty</th>
                  <th class="text-right">Min</th>
                  <th class="text-right">Value</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="products-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="product-modal-backdrop" class="modal-backdrop" aria-hidden="true">
  <div class="modal modal--wide" role="dialog">
    <div class="modal__header">
      <h2 class="modal__title">New product</h2>
      <button type="button" class="modal__close" id="product-modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal__body">
      <div class="form-row">
        <label class="field-label" for="modal-product-name">Name</label>
        <input id="modal-product-name" type="text" style="width:100%" />
      </div>
      <div class="form-row form-row--2">
        <div>
          <label class="field-label" for="modal-product-category">Category</label>
          <select id="modal-product-category" style="width:100%"><option value="">—</option></select>
        </div>
        <div>
          <label class="field-label" for="modal-product-supplier">Supplier</label>
          <select id="modal-product-supplier" style="width:100%"><option value="">—</option></select>
        </div>
      </div>
      <div class="form-row form-row--2">
        <div>
          <label class="field-label" for="modal-product-price">Price</label>
          <input id="modal-product-price" type="number" step="0.01" min="0" style="width:100%" />
        </div>
        <div>
          <label class="field-label" for="modal-product-quantity">Quantity</label>
          <input id="modal-product-quantity" type="number" min="0" style="width:100%" />
        </div>
      </div>
      <div class="form-row">
        <label class="field-label" for="modal-product-min">Minimum stock level</label>
        <input id="modal-product-min" type="number" min="0" style="width:100%" />
      </div>
      <div id="product-modal-message" class="auth-message"></div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn btn--ghost" id="product-modal-cancel">Cancel</button>
      <button type="button" class="btn" id="product-modal-save">Save</button>
    </div>
  </div>
</div>

<script src="apiClient.js"></script>
<script src="guard.js"></script>
<script src="products.js"></script>
</body>
</html>
